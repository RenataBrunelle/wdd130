<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">

    <meta name="description"
        content="Learn more about Rafting Adventure: our mission, history, values, and passion for connecting people with nature through rafting.">

    <link rel="stylesheet" href="styles/rafting.css">

<body>
    <header>
        <nav>
            <img src="images/logo.jpeg" alt="Logo" width="200">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="home">
            <img src="images/home.jpg" alt="Home Image">
            <h1>Come have fun and adventure with Rafting Adventure!</h1>
        </div>
        <div class="explication">
            <figure>
                <img src="images/home_1.jpg" alt="Home 1">

            <figure>
                <img src="images/home_2.jpg" alt="Home 2">

        <nav class="socialmedia">
            <a href="https://facebook.com">

            <a href="https://linkedin.com">
